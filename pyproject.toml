# pyproject.toml — odoo-argentina (raíz)
#
# Config Ruff a nivel raíz del repo odoo-argentina. Cubre los archivos que NO
# están bajo un subtree con su propio pyproject.toml:
#   - mueve-modules/        (eh_account_base, l10n_ar_inflation_adjustment, …)
#   - scripts/, archivos de raíz, oca_dependencies.txt, etc.
#
# Los subtrees adhoc-modules/*/ tienen su propio pyproject.toml que replica la
# template ingadhoc (line-length=120 + pylint disable=all/enable allowlist).
# Ruff descubre config desde el archivo hacia arriba, así que el de cada
# subtree tiene precedencia para sus archivos. Esta config raíz sólo aplica
# donde no hay otra — principalmente mueve-modules/.
#
# line-length=120 es el convenio ingadhoc/OCA-actual; alinea ruff-format con
# --max-line-length=120 del hook pylint_odoo (ver .pre-commit-config.yaml) de
# modo que C0301 no dispare falsos positivos en el rango 100–120.
#
# Pylint: ver el bloque [tool.pylint.*] al final de este archivo.

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # line too long — delegado a ruff-format + pylint C0301
    "E712",  # equality comparisons to False (común en Odoo)
    "E722",  # bare except (común en código legacy)
    "E731",  # lambda assignment
    "E741",  # ambiguous variable name
    "UP008", # super() instead of super(__class__, self) (no autofix seguro)
    "UP031", # percent-format (no autofix)
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401", "I001"]
"__manifest__.py" = ["E", "F", "W"]
"migrations/*" = ["E", "F", "W"]

[tool.ruff.lint.isort]
combine-as-imports = true
force-wrap-aliases = true
known-third-party = [
    "dateutil",
    "pkg_resources",
    "psycopg2",
    "requests",
    "setuptools",
    "yaml",
]
section-order = ["future", "standard-library", "third-party", "first-party", "local-folder"]

[tool.ruff.format]
quote-style = "preserve"

# ---------------------------------------------------------------------------
# pylint-odoo — copia literal del bloque [tool.pylint.*] de
# adhoc-modules/*/pyproject.toml (los 5 subtrees traen un bloque idéntico).
#
# El hook `pylint_odoo` de .pre-commit-config.yaml corre con cwd = raíz del
# repo, y pylint 3 descubre su config desde el cwd hacia arriba: nunca llega
# al pyproject del subtree. Sin este bloque pylint corría con defaults y
# marcaba C0114/C0116/C0103/W0212/C0209 en TODOS los archivos Odoo (el hook
# estaba en rojo en todo el repo, también en archivos sin tocar).
#
# Mantener sincronizado con adhoc-modules/*/pyproject.toml.
# ---------------------------------------------------------------------------
[tool.pylint.master]
load-plugins = ["pylint_odoo"]
score = false

[tool.pylint.odoolint]
manifest-required-authors = "ADHOC SA"
manifest-required-keys = ["license"]
manifest-deprecated-keys = ["description", "active"]
license-allowed = [
    "AGPL-3",
    "GPL-2",
    "GPL-2 or any later version",
    "GPL-3",
    "GPL-3 or any later version",
    "LGPL-3",
]

[tool.pylint."messages control"]
disable = "all"
enable = [
    "anomalous-backslash-in-string",
    "api-one-deprecated",
    "api-one-multi-together",
    "assignment-from-none",
    "attribute-deprecated",
    "attribute-string-redundant",
    "character-not-valid-in-resource-link",
    "class-camelcase",
    "consider-merging-classes-inherited",
    "context-overridden",
    "create-user-wo-reset-password",
    "dangerous-default-value",
    "dangerous-filter-wo-user",
    "dangerous-qweb-replace-wo-priority",
    "dangerous-view-replace-wo-priority",
    "deprecated-data-xml-node",
    "deprecated-openerp-xml-node",
    "development-status-allowed",
    "duplicate-id-csv",
    "duplicate-key",
    "duplicate-po-message-definition",
    "duplicate-xml-fields",
    "duplicate-xml-record-id",
    "eval-referenced",
    "eval-used",
    # "except-pass",                    # Annoying
    "external-request-timeout",
    "file-not-used",
    "incoherent-interpreter-exec-perm",
    "invalid-commit",
    "license-allowed",
    "manifest-author-string",
    "manifest-deprecated-key",
    "manifest-maintainers-list",
    "manifest-required-author",
    "manifest-required-key",
    # "manifest-version-format",        # Errors on non-migrated modules, and redundant with runbot
    "method-compute",
    "method-inverse",
    "method-required-super",
    "method-search",
    "missing-newline-extrafiles",
    # "missing-return",                 # Annoying. Not applicable for computed field methods
    "odoo-addons-relative-import",
    "old-api7-method-defined",
    "openerp-exception-warning",
    "po-msgstr-variables",
    "po-syntax-error",
    "pointless-statement",
    "pointless-string-statement",
    "print-used",
    "redundant-keyword-arg",
    "redundant-modulename-xml",
    "reimported",
    "relative-import",
    "renamed-field-parameter",
    "resource-not-exist",
    "return-in-init",
    "rst-syntax-error",
    "sql-injection",
    "str-format-used",
    "test-folder-imported",
    "too-few-format-args",
    "translation-contains-variable",
    "translation-field",
    # "translation-positional-used",    # Annoying in our use case
    # "translation-required",           # We don't always translate everything, and that's fine
    "unnecessary-utf8-coding-comment",
    "unreachable",
    "use-vim-comment",
    "wrong-tabs-instead-of-spaces",
    "xml-attribute-translatable",
    "xml-deprecated-qweb-directive",
    "xml-deprecated-tree-attribute",
    "xml-syntax-error"
]

[tool.pylint.reports]
output-format = "colorized"
msg-template = "{path}:{line}: [{msg_id}({symbol}), {obj}] {msg}"
