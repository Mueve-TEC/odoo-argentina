# pre-commit — odoo-argentina (Mueve-TEC/odoo-argentina, branch 19.0)
#
# Recrea la stack "adhoc" de ingadhoc en la raíz de este repo. Antes de esta
# config, los únicos .pre-commit-config.yaml del arbol vivían DENTRO de cada
# subtree (adhoc-modules/*/.pre-commit-config.yaml, generados por copier) y
# pre-commit —que usa el config del git toplevel— no los invocaba al correr
# desde la raíz. Esta config activa la misma stack adhoc para TODO el arbol:
#   - adhoc-modules/*   (subtrees ingadhoc/adhoc-dev — ya validados upstream con este mismo stack)
#   - mueve-modules/    (módulos propios de Mueve: eh_account_base, l10n_ar_inflation_adjustment, …)
#   - archivos de raíz   (scripts/, oca_dependencies.txt, README.md, etc.)
#
# Los .pre-commit-config.yaml dentro de adhoc-modules/* quedan como
# documentación de origen upstream y sólo se usan si se invocan explícitamente:
#   pre-commit run --all-files --config adhoc-modules/<sub>/.pre-commit-config.yaml
#
# NOTA: los subtrees usaban ruff v0.6.8, pylint-odoo v9.1.3, odoo-pre-commit-hooks
# v0.0.35, pre-commit-hooks v5.0.0, rstcheck v6.2.1. Esta replica esas versiones para
# minimizar diferencias con el upstream. La repo OCA (bank-statement-import /
# account-reconcile) usa una stack más pesada (whool, maintainer-tools,
# prettier, eslint) — NO se replica aquí a propósito para mantener la paridad
# con ingadhoc.
#
# Instalación (una vez desde la raíz de odoo-argentina):  pre-commit install
# Uso manual:        pre-commit run --all-files   (o `make lint-odoo-ar` desde el supermódulo)

exclude: |
  (?x)
  # We don't want to mess with tool-generated files
  .svg$|/tests/([^/]+/)?cassettes/|^.copier-answers.yml$|^.github/|^eslint.config.cjs|^prettier.config.cjs|
  # Library files can have extraneous formatting (even minimized)
  /static/(src/)?lib/|
  # Ignore build and dist directories in addons
  /build/|/dist/|
  # Ignore test files in addons
  /tests/samples/.*|
  # You don't usually want a bot to modify your legal texts
  (LICENSE.*|COPYING.*)

# Keep in sync with .github/workflows/pre-commit.yml
default_language_version:
    python: python3

repos:

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-added-large-files
      - id: check-case-conflict
      - id: check-docstring-first
      - id: check-executables-have-shebangs
      - id: check-merge-conflict
        args: ['--assume-in-merge']
        exclude: '\.(rst|md)$'
      - id: check-symlinks
      - id: check-xml
      - id: check-yaml
      - id: debug-statements
      - id: end-of-file-fixer
      - id: mixed-line-ending
        args: ["--fix=lf"]
      - id: trailing-whitespace
        # exclude autogenerated files
        exclude: \.pot?$

  - repo: https://github.com/OCA/odoo-pre-commit-hooks
    rev: v0.0.35
    hooks:
      - id: oca-checks-odoo-module
        args:
          - --disable=xml-dangerous-qweb-replace-low-priority,xml-view-dangerous-replace-low-priority,xml-oe-structure-missing-id
      - id: oca-checks-po
        args:
          - --disable=po-pretty-format

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.6.8
    hooks:
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix]
      - id: ruff-format

  - repo: https://github.com/OCA/pylint-odoo
    rev: v9.1.3
    hooks:
      - id: pylint_odoo
        args:
          # E0401 (import-error): deps no instalados en el entorno de lint
          # (openpyxl, zeep, pyafipws, ...). Los subtrees adhoc ya excluyen
          # esto vía su pyproject.toml (disable=all + enable allowlist); estos
          # args cubren mueve-modules/ que no tiene config propia.
          - --disable=E0401
          # C0301 (line-too-long): alineado con ruff line-length=120 (ver
          # pyproject.toml). ruff-format envuelve líneas >120 cuando puede
          # (calls, dicts, imports); para strings/comentarios largos que ruff
          # no puede envolver, pylint seguirá marcando >120 — esos casos
          # requieren wrap manual. Resuelve el caso 113/100.
          - --max-line-length=120

  - repo: https://github.com/rstcheck/rstcheck
    rev: v6.2.1
    hooks:
      - id: rstcheck
